[project]
name = "lead_generation"
version = "0.1.0"
description = "lead_generation using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0"
]

[project.scripts]
lead_generation = "lead_generation.main:run"
run_crew = "lead_generation.main:run"
train = "lead_generation.main:train"
replay = "lead_generation.main:replay"
test = "lead_generation.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
